name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的标签，如 v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: 测试
        run: go test -count=1 ./...

      - name: 确定版本号
        id: ver
        run: |
          V="${{ github.event.inputs.tag }}"
          [ -z "$V" ] && V="${GITHUB_REF#refs/tags/}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: 构建安装包
        run: ./scripts/build-release.sh "${{ steps.ver.outputs.version }}"

      - name: 校验产物
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          ls -lh

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          body_path: dist/RELEASE_NOTES.md
          draft: false
